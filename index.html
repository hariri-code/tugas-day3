<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Pages</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Guest Book</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#"
                >About Us</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1>Leave Message</h1>
      <form id="userForm">
        <label class="form-name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        />

        <label class="form-message">Message</label>
        <textarea
          id="message"
          placeholder="Write your message here"
          required
        ></textarea>
        <button id="submitBtn" class="btn-submit">Submit message</button>
      </form>

      <div class="card">
        <h1>New messages</h1>
        <div class="row" id="messageList"></div>
      </div>
    </div>

    <footer>
      <div class="socials">
        <i
          class="fa-brands fa-github fa-2xl"
          style="color: rgb(177, 151, 252)"
        ></i>
        <i
          class="fa-brands fa-linkedin-in fa-2xl"
          style="color: rgb(177, 151, 252)"
        ></i>
        <i
          class="fa-brands fa-instagram fa-2xl"
          style="color: rgb(177, 151, 252)"
        ></i>
        <i
          class="fa-brands fa-facebook fa-2xl"
          style="color: rgb(177, 151, 252)"
        ></i>
      </div>

      <p>&copy; 2026 Rifki Bilal Hariri. All Rights Reserved.</p>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
